<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股黄金btc当日变更 | Glassmorphism</title>
    <style>
        :root {
            --primary-text: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.7);
            --up-color: #00e676;   /* 股票上涨的绿色 */
            --down-color: #ff5252; /* 股票下跌的红色 */
            --glass-bg: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(20px);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-num: 'Fira Code', 'Cascadia Code', Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f141e;
            overflow: hidden;
            padding: 20px;
        }

        /* 动态多源流光背景 */
        .background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .circle { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: move linear infinite; }
        .circle-1 { width: 450px; height: 450px; background: #2962ff; top: -10%; left: -10%; animation-duration: 25s; }
        .circle-2 { width: 550px; height: 550px; background: #00b4d8; bottom: -20%; right: -10%; animation-duration: 30s; animation-direction: reverse; }
        .circle-3 { width: 350px; height: 350px; background: #7b2cbf; top: 40%; left: 60%; animation-duration: 20s; }

        @keyframes move {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(80px, 60px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* 主体卡片 */
        .glass-card {
            width: 100%;
            max-width: 900px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff, #90caf9);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }

        .time-indicator {
            font-size: 0.85rem;
            color: var(--secondary-text);
            margin-bottom: 30px;
            font-family: var(--font-num);
            display: flex;
            align-items: center;
        }

        .pulse {
            width: 8px; height: 8px; background-color: var(--up-color);
            border-radius: 50%; margin-right: 8px;
            box-shadow: 0 0 10px var(--up-color);
            animation: blink 1.5s infinite;
        }

        /* 优化后的 5 标的完美对称网格 */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 划分为6等份的底层网格 */
            gap: 20px;
        }

        /* 单个股票的小玻璃卡片 */
        .ticker-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s ease, background 0.3s ease;
            position: relative;
        }

        /* 前三个卡片（三大指数）：各占 2 份，刚好填满第一行 (2+2+2=6) */
        .ticker-card:nth-child(1),
        .ticker-card:nth-child(2),
        .ticker-card:nth-child(3) {
            grid-column: span 2;
        }

        /* 后两个卡片（黄金和BTC）：各占 3 份，平分第二行 (3+3=6) */
        .ticker-card:nth-child(4),
        .ticker-card:nth-child(5) {
            grid-column: span 3;
        }

        .ticker-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .ticker-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-text);
            margin-bottom: 2px;
        }

        .ticker-symbol {
            font-size: 0.85rem;
            color: var(--secondary-text);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .ticker-price {
            font-family: var(--font-num);
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .ticker-change {
            font-family: var(--font-num);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        .neutral { color: var(--secondary-text); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .glass-card { padding: 25px; }
            .stock-grid { 
                grid-template-columns: repeat(2, 1fr); /* 移动端改为2列 */
            }
            .ticker-card:nth-child(n) {
                grid-column: span 1; /* 重置所有卡片占 1 份 */
            }
            .ticker-card:nth-child(5) {
                grid-column: span 2; /* 最后一个卡片在底部居中占满横排 */
            }
            .ticker-price { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <div class="glass-card">
        <h1>美股黄金btc当日变更</h1>
        <div class="status-indicator">
            <div class="pulse"></div> 实时 API 联接状态: 活跃 
        </div>
        <div class="time-indicator" id="market-time">时间加载中...</div>

        <div class="stock-grid" id="stock-grid">
            </div>
    </div>

    <script>
        const API_KEY = 'd7a7nmhr01qn9i7jv7j0d7a7nmhr01qn9i7jv7jg';

        const PORTFOLIO = [
            { id: 'spy',  symbol: 'SPY',  name: '标普 500' },
            { id: 'qqqm', symbol: 'QQQM', name: '纳斯达克' },
            { id: 'dia',  symbol: 'DIA',  name: '道琼斯' },
            { id: 'gld',  symbol: 'GLD',  name: '黄金' },
            { id: 'ibit', symbol: 'IBIT', name: '比特币' }
        ];

        const gridElement = document.getElementById('stock-grid');

        function initCards() {
            PORTFOLIO.forEach(stock => {
                const card = document.createElement('div');
                card.className = 'ticker-card';
                card.innerHTML = `
                    <div class="ticker-name">${stock.name}</div>
                    <div class="ticker-symbol">${stock.symbol}</div>
                    <div class="ticker-price neutral" id="price-${stock.id}">获取中...</div>
                    <div class="ticker-change neutral" id="change-${stock.id}">--</div>
                `;
                gridElement.appendChild(card);
            });
        }

        async function fetchMarketData() {
            for (let i = 0; i < PORTFOLIO.length; i++) {
                const stock = PORTFOLIO[i];
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
                    
                    if (!response.ok) {
                        console.error(`[${stock.symbol}] 请求受限或失败，状态码: ${response.status}`);
                        continue;
                    }

                    const data = await response.json();
                    
                    const currentPrice = data.c;
                    const previousClose = data.pc;
                    
                    if(!currentPrice || currentPrice === 0) continue;

                    const diff = (currentPrice - previousClose).toFixed(2);
                    const percent = ((diff / previousClose) * 100).toFixed(2);
                    const isUp = diff >= 0;

                    updateDOM(stock.id, currentPrice.toFixed(2), diff, percent, isUp);

                } catch (error) {
                    console.error(`[${stock.symbol}] 网络错误:`, error);
                }
            }
        }

        function updateDOM(id, price, diff, percent, isUp) {
            const priceEl = document.getElementById(`price-${id}`);
            const changeEl = document.getElementById(`change-${id}`);

            priceEl.innerText = `$${price}`;
            
            const sign = isUp && diff > 0 ? '+' : '';
            changeEl.innerText = `${sign}${diff} (${sign}${percent}%)`;

            if (diff > 0) {
                priceEl.className = 'ticker-price up';
                changeEl.className = 'ticker-change up';
            } else if (diff < 0) {
                priceEl.className = 'ticker-price down';
                changeEl.className = 'ticker-change down';
            } else {
                priceEl.className = 'ticker-price neutral';
                changeEl.className = 'ticker-change neutral';
            }
        }

        function updateMarketTime() {
            const timeEl = document.getElementById('market-time');
            
            const now = new Date();
            const nyTimeString = now.toLocaleString("en-US", {timeZone: "America/New_York"});
            const nyTime = new Date(nyTimeString);
            
            const hours = nyTime.getHours().toString().padStart(2, '0');
            const minutes = nyTime.getMinutes().toString().padStart(2, '0');
            const seconds = nyTime.getSeconds().toString().padStart(2, '0');
            const currentTimeStr = `美东时间: ${hours}:${minutes}:${seconds}`;

            let nextOpen = new Date(nyTime);
            nextOpen.setHours(9, 30, 0, 0);

            if (nyTime.getTime() > nextOpen.getTime()) {
                nextOpen.setDate(nextOpen.getDate() + 1);
            }
            
            if (nextOpen.getDay() === 6) {
                nextOpen.setDate(nextOpen.getDate() + 2);
            } else if (nextOpen.getDay() === 0) {
                nextOpen.setDate(nextOpen.getDate() + 1);
            }

            const diffMs = nextOpen.getTime() - nyTime.getTime();
            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            const isWeekend = nyTime.getDay() === 0 || nyTime.getDay() === 6;
            const pastOpen = nyTime.getHours() > 9 || (nyTime.getHours() === 9 && nyTime.getMinutes() >= 30);
            const beforeClose = nyTime.getHours() < 16;
            const isOpen = !isWeekend && pastOpen && beforeClose;

            let countdownStr = "";
            if (isOpen) {
                countdownStr = " (美股交易中)";
            } else {
                countdownStr = ` (距离美股开盘还有 ${diffHrs}小时 ${diffMins}分钟)`;
            }

            timeEl.innerText = `${currentTimeStr} ${countdownStr}`;
        }

        initCards();
        fetchMarketData();
        updateMarketTime();

        setInterval(updateMarketTime, 1000);
        setInterval(fetchMarketData, 6000);

    </script>
</body>
</html>
