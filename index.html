<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股黄金btc日内变更预览 | SWISS GRID TERMINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #000;
            padding: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            grid-column: span 12;
            border-bottom: 4px solid #000;
            padding-bottom: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header-left h1 {
            font-size: 3rem;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }
        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .api-status {
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }
        .status-dot {
            width: 10px; height: 10px; background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: blink 1.5s infinite;
        }
        #market-time {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.05em;
        }
        .market-countdown {
            font-size: 0.75rem;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }

        .stock-grid {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px;
            margin-bottom: 40px;
        }
        .ticker-card {
            border-left: 3px solid #000;
            padding-left: 15px;
            padding-bottom: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .ticker-card:hover { background: #e0e0e0; }
        .ticker-card.active { background: #000; color: #fff; }
        
        .ticker-name { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .ticker-price { font-size: 2.2vw; font-weight: 900; letter-spacing: -0.03em; }
        .ticker-change { font-size: 0.8vw; font-weight: bold; margin-top: 2px; }

        #chart-view {
            grid-column: span 12;
            height: 550px;
            border: 4px solid #000;
            position: relative;
            background: #fff;
            margin-top: 20px;
        }
        #chart-container { width: 100%; height: 100%; }
        .chart-label {
            position: absolute;
            top: -25px;
            left: 20px;
            background: #f4f4f4;
            padding: 0 10px;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            z-index: 10;
        }

        .up { color: inherit; }
        .down { color: #666; }
        .active .down { color: #aaa; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 1024px) {
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .header-right { text-align: left; }
            .api-status { justify-content: flex-start; }
            .stock-grid { grid-template-columns: repeat(3, 1fr); }
            .ticker-price { font-size: 4vw; }
            .ticker-change { font-size: 1.5vw; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>市场系统.01<br>MARKET SYSTEM.01</h1>
            </div>
            <div class="header-right">
                <div class="api-status">
                    <div class="status-dot"></div> 实时 API 联接状态: 活跃 | STATUS: ACTIVE
                </div>
                <div id="market-time">--:--:--</div>
                <div class="market-countdown" id="market-countdown">距离美股开盘...</div>
            </div>
        </header>
        <div class="stock-grid" id="stock-grid"></div>
        <div id="chart-view">
            <div class="chart-label">历史 K 线监控终端 | HISTORICAL K-LINE TERMINAL</div>
            <div id="chart-container"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_KEY = 'd7a7nmhr01qn9i7jv7j0d7a7nmhr01qn9i7jv7jg';
        const PORTFOLIO = [
            { id: 'spy',  symbol: 'SPY',  name: '标普 500 | S&P 500' },
            { id: 'qqqm', symbol: 'QQQM', name: '纳斯达克 | NASDAQ' },
            { id: 'dia',  symbol: 'DIA',  name: '道琼斯 | DOW JONES' },
            { id: 'gld',  symbol: 'GLD',  name: '黄金 | GOLD' },
            { id: 'btc',  symbol: 'BINANCE:BTCUSDT', name: '比特币 | BITCOIN' }
        ];
        const gridElement = document.getElementById('stock-grid');
        let currentSymbol = '';

        function initCards() {
            PORTFOLIO.forEach(stock => {
                const card = document.createElement('div');
                card.className = 'ticker-card';
                card.onclick = () => loadChart(stock.symbol, card);
                card.innerHTML = `<div class="ticker-name">${stock.name}</div><div class="ticker-price" id="price-${stock.id}">0.00</div><div class="ticker-change" id="change-${stock.id}">--</div>`;
                gridElement.appendChild(card);
            });
            setTimeout(() => {
                const firstCard = document.querySelector('.ticker-card');
                if(firstCard) loadChart(PORTFOLIO[0].symbol, firstCard);
            }, 500);
        }

        function updateMarketTime() {
            const timeEl = document.getElementById('market-time');
            const countdownEl = document.getElementById('market-countdown');
            const now = new Date();
            const nyTimeString = now.toLocaleString("en-US", {timeZone: "America/New_York"});
            const nyTime = new Date(nyTimeString);
            const hours = nyTime.getHours().toString().padStart(2, '0');
            const minutes = nyTime.getMinutes().toString().padStart(2, '0');
            const seconds = nyTime.getSeconds().toString().padStart(2, '0');
            timeEl.innerText = `${hours}:${minutes}:${seconds} EST`;

            let nextOpen = new Date(nyTime);
            nextOpen.setHours(9, 30, 0, 0);
            if (nyTime.getTime() > nextOpen.getTime()) nextOpen.setDate(nextOpen.getDate() + 1);
            while (nextOpen.getDay() === 0 || nextOpen.getDay() === 6) nextOpen.setDate(nextOpen.getDate() + 1);

            const diffMs = nextOpen.getTime() - nyTime.getTime();
            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const isWeekend = nyTime.getDay() === 0 || nyTime.getDay() === 6;
            const isOpen = !isWeekend && (nyTime.getHours() > 9 || (nyTime.getHours() === 9 && nyTime.getMinutes() >= 30)) && nyTime.getHours() < 16;
            countdownEl.innerText = isOpen ? "美股交易中 | MARKET OPEN" : `距离开盘还有 ${diffHrs}H ${diffMins}M | NEXT OPEN IN ${diffHrs}H ${diffMins}M`;
        }

        function loadChart(symbol, element) {
            if (currentSymbol === symbol) return;
            currentSymbol = symbol;
            document.querySelectorAll('.ticker-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "light",
                "style": "1",
                "locale": "zh_CN",
                "toolbar_bg": "#f4f4f4",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "save_image": false,
                "container_id": "chart-container"
            });
        }

        async function fetchMarketData() {
            const fetchPromises = PORTFOLIO.map(async (stock) => {
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
                    const data = await response.json();
                    if(data.c) updateDOM(stock.id, data.c.toFixed(2), (data.c - data.pc).toFixed(2), ((data.c - data.pc)/data.pc*100).toFixed(2), data.c >= data.pc);
                } catch (e) {}
            });
            await Promise.all(fetchPromises);
        }

        function updateDOM(id, price, diff, percent, isUp) {
            const p = document.getElementById(`price-${id}`);
            const c = document.getElementById(`change-${id}`);
            if(p) p.innerText = price;
            if(c) {
                c.innerText = `${isUp?'+':''}${percent}%`;
                p.className = `ticker-price ${isUp?'up':'down'}`;
            }
        }

        initCards(); fetchMarketData(); updateMarketTime();
        setInterval(updateMarketTime, 1000);
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
