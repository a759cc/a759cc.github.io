<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞士网格终端 | SWISS GRID TERMINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #000;
            padding: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            grid-column: span 12;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 {
            font-size: 3.5vw;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }
        .search-container {
            width: 350px;
            position: relative;
        }
        #symbol-search {
            width: 100%;
            border: 4px solid #000;
            padding: 10px 15px;
            font-family: 'Helvetica', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            outline: none;
            background: #fff;
        }
        #symbol-search:focus {
            background: #f0f0f0;
        }
        .search-hint {
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
            color: #666;
        }
        .stock-grid {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 20px;
            margin-bottom: 40px;
        }
        .ticker-card {
            border-left: 3px solid #000;
            padding-left: 15px;
            padding-bottom: 20px;
            cursor: pointer;
            transition: background 0.1s;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .ticker-card:hover { background: #e0e0e0; }
        .ticker-card.active { background: #000; color: #fff; }
        
        .ticker-name { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ticker-price { font-size: 2.2vw; font-weight: 900; letter-spacing: -0.03em; }
        .ticker-change { font-size: 0.8vw; font-weight: bold; margin-top: 2px; }

        /* Fixed Chart Area in Swiss Style */
        #chart-view {
            grid-column: span 12;
            height: 550px;
            border: 4px solid #000;
            position: relative;
            background: #fff;
            margin-top: 20px;
        }
        #chart-container { width: 100%; height: 100%; }
        .chart-label {
            position: absolute;
            top: -25px; /* 向上移动，防止遮挡选项栏 */
            left: 20px;
            background: #f4f4f4;
            padding: 0 10px;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            z-index: 10;
        }

        .up { color: inherit; }
        .down { color: #666; }
        .active .down { color: #aaa; }

        @media (max-width: 1024px) {
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .search-container { width: 100%; }
            .stock-grid { grid-template-columns: repeat(3, 1fr); }
            .ticker-price { font-size: 4vw; }
            .ticker-change { font-size: 1.5vw; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>市场系统.01<br>MARKET SYSTEM.01</h1>
            <div class="search-container">
                <input type="text" id="symbol-search" placeholder="搜索标的 | SEARCH SYMBOL..." onkeypress="handleSearch(event)">
                <div class="search-hint">输入代码并回车 (如: AAPL, TSLA, BTCUSDT)</div>
            </div>
        </header>
        <div id="market-time" style="grid-column: span 12; margin-bottom:20px; font-weight:bold; font-size: 0.8rem; border-bottom: 2px solid #000; padding-bottom: 10px;">数据加载中... | LOADING...</div>
        <div class="stock-grid" id="stock-grid"></div>
        <div id="chart-view">
            <div class="chart-label">历史 K 线监控终端 | HISTORICAL K-LINE TERMINAL</div>
            <div id="chart-container"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_KEY = 'd7a7nmhr01qn9i7jv7j0d7a7nmhr01qn9i7jv7jg';
        const PORTFOLIO = [
            { id: 'spy',  symbol: 'SPY',  name: '标普 500 | S&P 500' },
            { id: 'qqqm', symbol: 'QQQM', name: '纳斯达克 | NASDAQ' },
            { id: 'dia',  symbol: 'DIA',  name: '道琼斯 | DOW JONES' },
            { id: 'gld',  symbol: 'GLD',  name: '黄金 | GOLD' },
            { id: 'ibit', symbol: 'IBIT', name: '比特币 | BITCOIN' }
        ];
        const gridElement = document.getElementById('stock-grid');
        let currentSymbol = '';

        function initCards() {
            PORTFOLIO.forEach(stock => createCard(stock));
            // 默认加载第一个
            setTimeout(() => {
                const firstCard = document.querySelector('.ticker-card');
                if(firstCard) loadChart(PORTFOLIO[0].symbol, firstCard);
            }, 500);
        }

        function createCard(stock, prepend = false) {
            const card = document.createElement('div');
            card.className = 'ticker-card';
            card.id = `card-${stock.id}`;
            card.onclick = () => loadChart(stock.symbol, card);
            card.innerHTML = `<div class="ticker-name">${stock.name}</div><div class="ticker-price" id="price-${stock.id}">...</div><div class="ticker-change" id="change-${stock.id}">--</div>`;
            
            if (prepend) {
                gridElement.insertBefore(card, gridElement.firstChild);
                fetchSingleStock(stock); // 立即获取新搜索标的价格
            } else {
                gridElement.appendChild(card);
            }
        }

        async function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = event.target.value.toUpperCase().trim();
                if (!query) return;

                event.target.disabled = true;
                event.target.placeholder = "搜索中 | SEARCHING...";

                try {
                    // 1. 验证 Symbol 是否有效
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${query}&token=${API_KEY}`);
                    const data = await response.json();

                    if (data.c) {
                        const newStock = { 
                            id: query.toLowerCase(), 
                            symbol: query, 
                            name: `搜索结果 | ${query}` 
                        };
                        
                        // 如果已存在，直接加载图表
                        const existing = document.getElementById(`card-${newStock.id}`);
                        if (existing) {
                            loadChart(query, existing);
                        } else {
                            createCard(newStock, true);
                            const newCard = document.getElementById(`card-${newStock.id}`);
                            loadChart(query, newCard);
                        }
                        event.target.value = "";
                    } else {
                        alert("未找到该代码或 API 限制 | SYMBOL NOT FOUND");
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    event.target.disabled = false;
                    event.target.placeholder = "搜索标的 | SEARCH SYMBOL...";
                    event.target.focus();
                }
            }
        }

        async function fetchSingleStock(stock) {
            try {
                const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
                const data = await response.json();
                if(data.c) updateDOM(stock.id, data.c.toFixed(2), (data.c - data.pc).toFixed(2), ((data.c - data.pc)/data.pc*100).toFixed(2), data.c >= data.pc);
            } catch (e) {}
        }



        async function fetchMarketData() {
            const fetchPromises = PORTFOLIO.map(async (stock) => {
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
                    const data = await response.json();
                    if(data.c) updateDOM(stock.id, data.c.toFixed(2), (data.c - data.pc).toFixed(2), ((data.c - data.pc)/data.pc*100).toFixed(2), data.c >= data.pc);
                } catch (e) {}
            });
            await Promise.all(fetchPromises);
        }
        function updateDOM(id, price, diff, percent, isUp) {
            const p = document.getElementById(`price-${id}`);
            const c = document.getElementById(`change-${id}`);
            p.innerText = price;
            c.innerText = `${isUp?'+':''}${percent}%`;
            p.className = `ticker-price ${isUp?'up':'down'}`;
        }
        initCards(); fetchMarketData(); setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
