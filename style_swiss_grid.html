<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWISS GRID TERMINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #000;
            padding: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            grid-column: span 12;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 5vw;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }
        .stock-grid {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5个模块一排，缩小方格 */
            gap: 20px;
            margin-bottom: 30px;
        }
        .ticker-card {
            border-left: 3px solid #000;
            padding-left: 15px;
            padding-bottom: 20px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .ticker-card:hover { background: #e0e0e0; }
        .ticker-card.active { background: #000; color: #fff; }
        
        .ticker-name { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .ticker-price { font-size: 2.2vw; font-weight: 900; letter-spacing: -0.03em; }
        .ticker-change { font-size: 0.8vw; font-weight: bold; margin-top: 2px; }

        /* Fixed Chart Area in Swiss Style */
        #chart-view {
            grid-column: span 12;
            height: 500px;
            border: 4px solid #000;
            position: relative;
            background: #fff;
        }
        #chart-container { width: 100%; height: 100%; }
        .chart-label {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #f4f4f4;
            padding: 0 10px;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .up { color: inherit; }
        .down { color: #666; }
        .active .down { color: #aaa; }

        @media (max-width: 1024px) {
            .stock-grid { grid-template-columns: repeat(3, 1fr); }
            .ticker-price { font-size: 4vw; }
            .ticker-change { font-size: 1.5vw; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MARKET<br>SYSTEM.01</h1>
            <div id="market-time" style="margin-top:20px; font-weight:bold; font-size: 0.8rem;">LOADING...</div>
        </header>
        <div class="stock-grid" id="stock-grid"></div>
        <div id="chart-view">
            <div class="chart-label">Historical K-Line Terminal</div>
            <div id="chart-container"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_KEY = 'd7a7nmhr01qn9i7jv7j0d7a7nmhr01qn9i7jv7jg';
        const PORTFOLIO = [
            { id: 'spy',  symbol: 'SPY',  name: 'S&P 500' },
            { id: 'qqqm', symbol: 'QQQM', name: 'NASDAQ' },
            { id: 'dia',  symbol: 'DIA',  name: 'DOW JONES' },
            { id: 'gld',  symbol: 'GLD',  name: 'GOLD' },
            { id: 'ibit', symbol: 'IBIT', name: 'BITCOIN' }
        ];
        const gridElement = document.getElementById('stock-grid');
        let currentSymbol = '';

        function initCards() {
            PORTFOLIO.forEach(stock => {
                const card = document.createElement('div');
                card.className = 'ticker-card';
                card.onclick = () => loadChart(stock.symbol, card);
                card.innerHTML = `<div class="ticker-name">${stock.name}</div><div class="ticker-price" id="price-${stock.id}">0.00</div><div class="ticker-change" id="change-${stock.id}">--</div>`;
                gridElement.appendChild(card);
            });
            // 默认加载第一个
            setTimeout(() => {
                const firstCard = document.querySelector('.ticker-card');
                if(firstCard) loadChart(PORTFOLIO[0].symbol, firstCard);
            }, 500);
        }

        function loadChart(symbol, element) {
            if (currentSymbol === symbol) return;
            currentSymbol = symbol;

            document.querySelectorAll('.ticker-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "light",
                "style": "1",
                "locale": "zh_CN",
                "toolbar_bg": "#f4f4f4",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "save_image": false,
                "container_id": "chart-container"
            });
        }


        async function fetchMarketData() {
            const fetchPromises = PORTFOLIO.map(async (stock) => {
                try {
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
                    const data = await response.json();
                    if(data.c) updateDOM(stock.id, data.c.toFixed(2), (data.c - data.pc).toFixed(2), ((data.c - data.pc)/data.pc*100).toFixed(2), data.c >= data.pc);
                } catch (e) {}
            });
            await Promise.all(fetchPromises);
        }
        function updateDOM(id, price, diff, percent, isUp) {
            const p = document.getElementById(`price-${id}`);
            const c = document.getElementById(`change-${id}`);
            p.innerText = price;
            c.innerText = `${isUp?'+':''}${percent}%`;
            p.className = `ticker-price ${isUp?'up':'down'}`;
        }
        initCards(); fetchMarketData(); setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
